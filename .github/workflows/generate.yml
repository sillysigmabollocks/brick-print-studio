name: Generate Print ZIP
run-name: Generate set ${{ inputs.set_number }}

on:
  workflow_dispatch:
    inputs:
      set_number:
        description: LEGO set number (include version suffix, e.g. 60000-1)
        required: true
        type: string
      max_per_plate:
        description: Maximum copies per plate (1–100)
        default: 30
        type: number
      calibration:
        description: Include a stud-and-tube fit test
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install generator
        run: python -m pip install -r requirements.txt
      - name: Generate set
        env:
          SET_NUMBER: ${{ inputs.set_number }}
          MAX_PER_PLATE: ${{ inputs.max_per_plate }}
          CALIBRATION: ${{ inputs.calibration }}
        run: |
          set -euo pipefail
          args=(--max-per-plate "$MAX_PER_PLATE")
          if [[ "$CALIBRATION" == true ]]; then args+=(--calibration); fi
          python -m brickprint.generate "${args[@]}" -- "$SET_NUMBER" > print-result.json
      - name: Upload Print ZIP
        id: upload
        uses: actions/upload-artifact@v7
        with:
          path: exports/*.zip
          archive: false
          if-no-files-found: error
          retention-days: 7
      - name: Show download and quantities
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path

          result = json.loads(Path('print-result.json').read_text())
          print(f"## {Path(result['file']).name}")
          print()
          print(f"[Download the Print ZIP]({os.environ['ARTIFACT_URL']})")
          print()
          print(f"{result['plates']} color-grouped plates · {result['checked'] + result['review']} "
                f"of {result['required']} copies placed · {result['missing']} unplaced")
          print()
          print(f"{result['review']} placed copies have mesh warnings. "
                "See Printing_Batches inside the ZIP for plates and quantity reports.")
          PY
